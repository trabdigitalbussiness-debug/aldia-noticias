# Configuración de Netlify para «al día»
[build]
  publish = "app"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Las fotos de los periódicos se sirven reducidas y en formato ligero
# a través del servicio de imágenes de Netlify (/.netlify/images).
[images]
  remote_images = ["https://.*"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
