# Configuración de Netlify para «al día»
[build]
  publish = "app"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Permite que el servicio de imágenes de Netlify optimice las fotos de los periódicos
# (las reduce al tamaño de la pantalla y las convierte a WebP/AVIF).
[images]
  remote_images = ["https://.*"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
